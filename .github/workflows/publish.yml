# Publishes the staged wheels in this repository to PyPI or TestPyPI.
# Nothing is built here: dist/ already holds each wheel exactly as it is
# published.
#
#   GitHub release published  -> PyPI
#   Run workflow (manual)     -> TestPyPI by default, or PyPI if chosen
#
# Setup, once per index (pypi.org and test.pypi.org are separate accounts):
# add this repository as a trusted publisher of each of
# conviva-otlp-exporter, conviva-agent-traces-connector and
# conviva-agent-tracing, with workflow publish.yml and environment "pypi"
# (pypi.org) or "testpypi" (test.pypi.org). Before a project's first upload
# this is a "pending publisher".
#
# Versions already on the index are skipped, so re-running is safe.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      index:
        description: Package index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.index || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
